<!DOCTYPE html>

        :root {

        html { scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }

            background:var(--bg);

            line-height:1.6;
            min-height:100vh;

            flex-direction:column;
            align-items:center;

        .logo-text { font-family:var(--font-serif); font-size:1.25rem; font-weight:600; }
        .container { width:100%; max-width:720px; padding:16px 20px 40px; flex:1; display:flex; flex-direction:column; }
        .card {
            background:var(--card-bg); border-radius:var(--radius-lg); padding:36px 32px;
            box-shadow:var(--shadow-md); border:1px solid var(--border-light); transition:var(--transition);
            position:relative; overflow:hidden;

        .card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:3px;
            background:linear-gradient(90deg, #c4877b, #c49a5e, #7a9e7e, #6b8fa3, #8b7eac);

        .intro-title { font-family:var(--font-serif); font-size:2rem; font-weight:700; text-align:center; margin-bottom:6px; }
        .intro-subtitle { text-align:center; color:var(--text-secondary); font-size:0.95rem; margin-bottom:24px; }
        .intro-info { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:28px; }

        .intro-info-item {

        .info-num { font-size:1.5rem; font-weight:700; color:var(--accent); display:block; margin-bottom:2px; font-family:var(--font-serif); }
        .btn {

            padding:14px 32px; border-radius:50px; font-size:1rem; font-weight:600; cursor:pointer; border:none;
            letter-spacing:0.4px; transition:var(--transition); text-decoration:none; font-family:var(--font-sans);

        .btn-outline { background:transparent; color:var(--accent); border:2px solid var(--accent); }
        .btn-outline:hover { background:var(--accent-light); }
        .btn-ghost { background:transparent; color:var(--text-secondary); padding:10px 20px; }
        .btn-ghost:hover { background:var(--bg); color:var(--text); }
        .btn-sm { padding:8px 18px; font-size:0.85rem; border-radius:30px; }
        .btn-block { width:100%; justify-content:center; }
        .btn-row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

        .progress-bar { width:100%; height:5px; background:var(--border-light); border-radius:10px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--accent); border-radius:10px; transition:width 0.5s ease; }
        .question-number { font-size:0.8rem; letter-spacing:2px; color:var(--text-muted); margin-bottom:6px; font-weight:600; text-transform:uppercase; }

        @media(max-width:500px){ .question-text{font-size:1.15rem; margin-bottom:18px;} }
        .options { display:flex; flex-direction:column; gap:9px; }
        .option-btn {

            text-align:left; font-family:var(--font-sans); letter-spacing:0.3px;

        .option-btn.selected { background:var(--accent-light); border-color:var(--accent); color:var(--accent); font-weight:600; }
        .option-radio { width:20px; height:20px; border-radius:50%; border:2px solid #ccc; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:var(--transition); }
        .option-btn.selected .option-radio { border-color:var(--accent); background:var(--accent); }
        .option-btn.selected .option-radio::after { content:''; width:6px; height:6px; border-radius:50%; background:#fff; }
        .option-label { font-weight:500; font-size:0.78rem; color:var(--text-muted); min-width:56px; text-align:right; flex-shrink:0; }

        .result-type-code { font-family:var(--font-serif); font-size:3.5rem; font-weight:700; text-align:center; letter-spacing:6px; color:var(--accent); margin-bottom:2px; }

        .result-type-nickname { text-align:center; font-size:0.9rem; color:var(--text-muted); margin-bottom:24px; font-style:italic; }
        .dimensions-title { font-size:0.8rem; letter-spacing:2px; color:var(--text-muted); margin-bottom:14px; font-weight:600; text-align:center; text-transform:uppercase; }
        .result-description { background:var(--bg); border-radius:var(--radius-sm); padding:20px 18px; margin-bottom:16px; line-height:1.7; font-size:0.93rem; color:var(--text-secondary); border:1px solid var(--border-light); }
        .result-traits { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
        .result-trait { background:var(--accent-light); color:var(--accent); padding:6px 14px; border-radius:20px; font-size:0.8rem; font-weight:600; }
        .result-careers { font-size:0.85rem; color:var(--text-muted); margin-bottom:20px; line-height:1.6; }

            display:block; padding:10px 6px; text-align:center; background:var(--bg); border-radius:var(--radius-sm);

        .type-chip:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-light); }
        .type-chip.active { border-color:var(--accent); background:var(--accent); color:#fff; }
        .chip-code { font-family:var(--font-serif); font-size:0.85rem; letter-spacing:2px; }
        .chip-name { font-size:0.7rem; font-weight:400; opacity:0.8; margin-top:1px; }
        .type-chip.active .chip-name { opacity:1; }
        .footer { text-align:center; padding:20px; font-size:0.78rem; color:var(--text-muted); }
        .hidden { display:none !important; }
        .fade-in { animation:fadeIn 0.45s ease-out; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
    </style>
</head>

                { id: 68, question: "我享受生活中突如其来的惊喜和变化。", dimension: 3, reversed: true },
                { id: 69, question: "我通常同时进行多个项目，根据兴趣切换。", dimension: 3, reversed: true },
                { id: 70, question: "计划永远赶不上变化，所以我倾向于不做太详细的计划。", dimension: 3, reversed: true },
                { id: 71, question: "与提前规划相比，我更喜欢边走边看、灵活调整。", dimension: 3, reversed: true }
            ];

            const optionsList = [
                { value: 1, label: "非常不同意", shortLabel: "非常不同意" },
                { value: 2, label: "不同意", shortLabel: "不同意" },
                { value: 3, label: "中立 / 不确定", shortLabel: "中立" },
                { value: 4, label: "同意", shortLabel: "同意" },
                { value: 5, label: "非常同意", shortLabel: "非常同意" }
            ];

            const personalityData = {
                "INTJ": { name:"建筑师", nickname:"富有战略远见的规划者", description:"INTJ型的人是<b>战略思想家</b>，拥有极强的独立性和自律能力。他们善于从复杂的信息中提炼出清晰的逻辑框架，制定长远计划并坚定执行。", traits:["战略思维","独立自律","远见卓识","理性冷静","追求卓越"], careers:"科学家、工程师、策略顾问、律师、大学教授、软件架构师" },
                "INTP": { name:"逻辑学家", nickname:"充满好奇的思辨者", description:"INTP型的人是<b>天生的理论家</b>，对抽象概念和逻辑体系有着强烈的兴趣。他们享受独立思考，喜欢拆解问题、分析原理。", traits:["逻辑严密","好奇心强","思维灵活","客观理性","深度思考"], careers:"科学家、数学家、哲学家、软件开发者、研究分析师、作家" },
                "ENTJ": { name:"指挥官", nickname:"果断坚定的领导者", description:"ENTJ型的人是<b>天生的领导者</b>，拥有强烈的目标感和卓越的组织能力。他们善于制定战略、调动资源、带领团队前进。", traits:["领导力强","目标导向","果断决策","善于组织","自信坚定"], careers:"企业高管、政治家、创业者、管理顾问、军事指挥官、导演" },
                "ENTP": { name:"辩论家", nickname:"机智善辩的创新者", description:"ENTP型的人是<b>充满创意的思想家</b>，享受智力上的挑战和辩论。他们思维敏捷，善于建立关联，提出新颖见解。", traits:["机智敏捷","创意无限","善于辩论","思维开放","灵活多变"], careers:"企业家、发明家、律师、记者、创意总监、产品经理" },
                "INFJ": { name:"提倡者", nickname:"理想主义的精神导师", description:"INFJ型的人是<b>富有洞察力的理想主义者</b>，拥有深刻的直觉和强烈的同理心。他们真诚地希望帮助他人成长。", traits:["深刻洞察","强烈同理","理想主义","坚定信念","善于倾听"], careers:"心理咨询师、作家、教育工作者、人力资源专家、社会工作者、艺术家" },
                "INFP": { name:"调停者", nickname:"追求意义的理想家", description:"INFP型的人是<b>充满热情的理想主义者</b>，内心有一套坚定的价值观体系。他们富有创造力，善于表达丰富的情感世界。", traits:["理想主义","创造力强","真诚善良","富有同情","忠于价值"], careers:"作家、诗人、心理咨询师、平面设计师、非营利组织工作者、教师" },
                "ENFJ": { name:"主人公", nickname:"温暖有力的激励者", description:"ENFJ型的人是<b>富有魅力的引导者</b>，天生具有感染他人的热情和能量。他们善于理解他人的需求，激励团队发挥潜力。", traits:["感染力强","善于激励","人际和谐","责任心强","温暖可靠"], careers:"教师、培训师、公关专家、政治家、心理咨询师、销售经理" },
                "ENFP": { name:"竞选者", nickname:"热情洋溢的探索者", description:"ENFP型的人是<b>充满活力的自由精神</b>，对生活怀有无限的热情和好奇心。他们善于发现他人的潜力，并用真诚的鼓励帮助他人成长。", traits:["热情洋溢","创造力强","善于社交","乐观积极","灵活自由"], careers:"记者、创业者、广告创意人、演员、活动策划、自由职业者" },
                "ISTJ": { name:"物流师", nickname:"稳重可靠的责任担当", description:"ISTJ型的人是<b>踏实可靠的实干家</b>，重视事实、规则和秩序。他们做事一丝不苟，具有极强的责任心和执行力。", traits:["踏实可靠","责任心强","注重细节","遵守规则","耐心坚韧"], careers:"会计师、审计师、公务员、医生、军事人员、质量管理员" },
                "ISFJ": { name:"守卫者", nickname:"默默奉献的守护者", description:"ISFJ型的人是<b>温暖细心的守护者</b>，拥有强烈的责任感和服务精神。他们善于关注他人的实际需求，并默默提供帮助。", traits:["温暖细心","忠诚可靠","服务精神","注重细节","稳定务实"], careers:"护士、教师、社工、行政人员、图书管理员、客户服务专员" },
                "ESTJ": { name:"总经理", nickname:"高效务实的组织者", description:"ESTJ型的人是<b>高效务实的管理者</b>，擅长组织资源、制定流程并确保执行到位。他们重视效率和结果，决策果断直接。", traits:["高效务实","组织力强","果断直接","诚实可靠","执行力强"], careers:"企业管理者、法官、警察、财务总监、项目经理、学校校长" },
                "ESFJ": { name:"执政官", nickname:"热心周到的协调者", description:"ESFJ型的人是<b>热心周到的社交达人</b>，非常重视人际关系的和谐与稳定。他们善于察觉他人的需求，乐于提供实际的帮助。", traits:["热情周到","善于协调","忠诚可靠","乐于助人","组织力强"], careers:"护士、教师、销售经理、活动策划、社区工作者、人力资源专员" },
                "ISTP": { name:"鉴赏家", nickname:"冷静灵活的实践者", description:"ISTP型的人是<b>冷静沉着的实干家</b>，擅长动手操作和解决实际问题。他们喜欢理解事物运作的原理，并亲自尝试和实践。", traits:["冷静沉着","动手能力强","善于解决问题","独立自由","灵活应变"], careers:"工程师、技师、飞行员、外科医生、法医、摄影师" },
                "ISFP": { name:"探险家", nickname:"温和敏锐的艺术家", description:"ISFP型的人是<b>温柔细腻的艺术家</b>，拥有敏锐的审美感知和丰富的内心世界。他们喜欢用感官体验生活的美好。", traits:["审美敏锐","温柔细腻","行动表达","珍视自由","真实自然"], careers:"艺术家、设计师、音乐家、花艺师、摄影师、宠物医生" },
                "ESTP": { name:"企业家", nickname:"大胆果断的行动派", description:"ESTP型的人是<b>充满活力的行动者</b>，喜欢冒险和挑战。他们反应迅速，善于在瞬息万变的环境中做出果断决策。", traits:["大胆果断","反应迅速","务实行动","善于谈判","享受挑战"], careers:"企业家、销售精英、急救人员、运动员、投资人、侦探" },
                "ESFP": { name:"表演者", nickname:"感染力十足的乐天派", description:"ESFP型的人是<b>天生的人际焦点</b>，充满活力和感染力。他们热爱生活，喜欢与人交往，善于用自己的热情点亮周围的气氛。", traits:["感染力强","乐观开朗","适应力强","热爱生活","善于社交"], careers:"演员、主持人、销售代表、旅游博主、活动策划、健身教练" }
            };

            // ---------- 状态 ----------
            const state = {
                currentIndex: 0,
                answers: {},
                phase: 'intro'
            };

            // DOM 元素
            const introPage = document.getElementById('introPage');
            const testPage = document.getElementById('testPage');
            const resultPage = document.getElementById('resultPage');
            const allTypesCard = document.getElementById('allTypesCard');
            const questionText = document.getElementById('questionText');
            const questionNumber = document.getElementById('questionNumber');
            const optionsContainer = document.getElementById('optionsContainer');
            const progressFill = document.getElementById('progressFill');
            const progressLabel = document.getElementById('progressLabel');
            const progressPercent = document.getElementById('progressPercent');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const resultContent = document.getElementById('resultContent');
            const allTypesGrid = document.getElementById('allTypesGrid');
            const typeDetailPanel = document.getElementById('typeDetailPanel');

            // ---------- 辅助函数 ----------
            function showPage(page) {
                introPage.classList.add('hidden');
                testPage.classList.add('hidden');
                resultPage.classList.add('hidden');
                allTypesCard.classList.add('hidden');
                if (page === 'intro') introPage.classList.remove('hidden');
                else if (page === 'test') testPage.classList.remove('hidden');
                else if (page === 'result') {
                    resultPage.classList.remove('hidden');
                    allTypesCard.classList.remove('hidden');
                }
            }

            function renderQuestion() {
                const q = questions[state.currentIndex];
                questionNumber.textContent = `第 ${state.currentIndex + 1} 题`;
                questionText.textContent = q.question;
                optionsContainer.innerHTML = '';
                const currentAnswer = state.answers[q.id];
                optionsList.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn' + (currentAnswer === opt.value ? ' selected' : '');
                    btn.innerHTML = `<span class="option-radio"></span><span>${opt.label}</span><span class="option-label">${opt.shortLabel}</span>`;
                    btn.addEventListener('click', () => {
                        state.answers[q.id] = opt.value;
                        renderQuestion();
                        updateNavButtons();
                    });
                    optionsContainer.appendChild(btn);
                });
                document.getElementById('questionArea').classList.remove('fade-in');
                void document.getElementById('questionArea').offsetWidth;
                document.getElementById('questionArea').classList.add('fade-in');
            }

            function updateProgress() {
                const total = questions.length;
                const answered = Object.keys(state.answers).length;
                const pct = Math.round((answered / total) * 100);
                progressFill.style.width = pct + '%';
                progressLabel.textContent = `题目 ${state.currentIndex + 1} / ${total}`;
                progressPercent.textContent = pct + '%';
            }

            function updateNavButtons() {
                const q = questions[state.currentIndex];
                const hasAnswer = state.answers[q.id] !== undefined;
                prevBtn.classList.toggle('hidden', state.currentIndex === 0);
                nextBtn.textContent = state.currentIndex === questions.length - 1 ? '查看结果 ✦' : '下一题 →';
                nextBtn.disabled = !hasAnswer;
            }

            function nextQuestion() {
                const q = questions[state.currentIndex];
                if (state.answers[q.id] === undefined) return;
                if (state.currentIndex < questions.length - 1) {
                    state.currentIndex++;
                    renderQuestion();
                    updateProgress();
                    updateNavButtons();
                    document.getElementById('mainContainer').scrollIntoView({ behavior: 'smooth' });
                } else {
                    showResults();
                }
            }

            function prevQuestion() {
                if (state.currentIndex > 0) {
                    state.currentIndex--;
                    renderQuestion();
                    updateProgress();
                    updateNavButtons();
                    document.getElementById('mainContainer').scrollIntoView({ behavior: 'smooth' });
                }
            }

            function calculateResults() {
                const dimScores = [0, 0, 0, 0];
                const dimCounts = [0, 0, 0, 0];
                questions.forEach(q => {
                    const raw = state.answers[q.id];
                    if (raw !== undefined) {
                        const effective = q.reversed ? (6 - raw) : raw;
                        dimScores[q.dimension] += effective;
                        dimCounts[q.dimension]++;
                    }
                });
                const typeLetters = [
                    dimScores[0] >= 54 ? 'E' : 'I',
                    dimScores[1] >= 54 ? 'S' : 'N',
                    dimScores[2] >= 54 ? 'T' : 'F',
                    dimScores[3] >= 54 ? 'J' : 'P'
                ];
                const typeCode = typeLetters.join('');
                const dimPercentages = dimScores.map((s, i) => {
                    const max = dimCounts[i] * 5;
                    const min = dimCounts[i] * 1;
                    const range = max - min;
                    return range > 0 ? Math.round(((s - min) / range) * 100) : 50;
                });
                return { typeCode, dimPercentages };
            }

            function showResults() {
                const { typeCode, dimPercentages } = calculateResults();
                const p = personalityData[typeCode];
                const pairs = [
                    { left:'I', right:'E', lc:'#6b8fa3', rc:'#c4877b' },
                    { left:'N', right:'S', lc:'#8b7eac', rc:'#7a9e7e' },
                    { left:'F', right:'T', lc:'#c47d8a', rc:'#5b8aab' },
                    { left:'P', right:'J', lc:'#c49a5e', rc:'#5a7d8a' }
                ];
                let barsHTML = '';
                pairs.forEach((pair, i) => {
                    const pct = dimPercentages[i];
                    const leftW = Math.max(0, 100 - pct);
                    const rightW = Math.max(0, pct);
                    const letter = pct >= 50 ? pair.right : pair.left;
                    const color = pct >= 50 ? pair.rc : pair.lc;
                    barsHTML += `
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                            <span style="font-weight:700;width:32px;text-align:right;color:${pair.lc};">${pair.left}</span>
                            <div style="flex:1;height:18px;background:#f0ede8;border-radius:20px;position:relative;overflow:hidden;display:flex;">
                                <div style="height:100%;width:${leftW}%;background:${pair.lc};border-radius:20px 0 0 20px;"></div>
                                <div style="height:100%;width:${rightW}%;background:${pair.rc};border-radius:0 20px 20px 0;"></div>
                                <div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;opacity:0.7;"></div>
                            </div>
                            <span style="font-weight:700;width:32px;text-align:left;color:${pair.rc};">${pair.right}</span>
                            <span style="font-weight:700;color:${color};width:36px;text-align:center;">${letter} ${pct}%</span>
                        </div>`;
                });
                resultContent.innerHTML = `
                    <div class="result-type-code">${typeCode}</div>
                    <div class="result-type-name">${p.name}</div>
                    <div class="result-type-nickname">「${p.nickname}」</div>
                    <div class="dimensions-title">维度分析</div>
                    ${barsHTML}
                    <div class="result-description">${p.description}</div>
                    <div class="result-traits">${p.traits.map(t => `<span class="result-trait">${t}</span>`).join('')}</div>
                    <div class="result-careers"><span>💼 适合职业方向：</span>${p.careers}</div>`;
                state.phase = 'result';
                showPage('result');
                renderAllTypesGrid(typeCode);
                document.getElementById('mainContainer').scrollIntoView({ behavior: 'smooth' });
            }

            function renderAllTypesGrid(activeCode) {
                allTypesGrid.innerHTML = '';
                Object.keys(personalityData).forEach(code => {
                    const pers = personalityData[code];
                    const chip = document.createElement('button');
                    chip.className = 'type-chip' + (code === activeCode ? ' active' : '');
                    chip.innerHTML = `<span class="chip-code">${code}</span><span class="chip-name">${pers.name}</span>`;
                    chip.addEventListener('click', () => {
                        showTypeDetail(code);
                        allTypesGrid.querySelectorAll('.type-chip').forEach(c => c.classList.remove('active'));
                        chip.classList.add('active');
                    });
                    allTypesGrid.appendChild(chip);
                });
                typeDetailPanel.innerHTML = '';
            }

            function showTypeDetail(code) {
                const p = personalityData[code];
                typeDetailPanel.innerHTML = `
                    <div style="background:var(--bg);border-radius:8px;padding:16px;border:1px solid var(--border-light);margin-top:8px;">
                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                            <span style="font-family:var(--font-serif);font-size:1.5rem;font-weight:700;color:var(--accent);">${code}</span>
                            <span style="font-weight:600;">${p.name}</span>
                            <span style="color:var(--text-muted);font-style:italic;">「${p.nickname}」</span>
                        </div>
                        <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;">${p.description}</p>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;">
                            ${p.traits.map(t => `<span style="background:var(--accent-light);color:var(--accent);padding:4px 10px;border-radius:16px;font-size:0.73rem;font-weight:600;">${t}</span>`).join('')}
                        </div>
                        <p style="font-size:0.78rem;color:var(--text-muted);"><span style="font-weight:600;">💼 适合职业：</span>${p.careers}</p>
                    </div>`;
                typeDetailPanel.scrollIntoView({ behavior: 'smooth' });
            }

            // ---------- 事件绑定 ----------
            document.getElementById('startBtn').addEventListener('click', () => {
                state.phase = 'test';
                state.currentIndex = 0;
                state.answers = {};
                showPage('test');
                renderQuestion();
                updateProgress();
                updateNavButtons();
                document.getElementById('mainContainer').scrollIntoView({ behavior: 'smooth' });
            });

            document.getElementById('restartBtn').addEventListener('click', () => {
                state.phase = 'test';
                state.currentIndex = 0;
                state.answers = {};
                showPage('test');
                renderQuestion();
                updateProgress();
                updateNavButtons();
                document.getElementById('mainContainer').scrollIntoView({ behavior: 'smooth' });
            });

            document.getElementById('viewAllBtn').addEventListener('click', () => {
                allTypesCard.scrollIntoView({ behavior: 'smooth' });
            });

            prevBtn.addEventListener('click', prevQuestion);
            nextBtn.addEventListener('click', nextQuestion);

            document.addEventListener('keydown', (e) => {
                if (state.phase !== 'test') return;
                if (e.key === 'ArrowRight' || e.key === 'Enter') {
                    const q = questions[state.currentIndex];
                    if (state.answers[q.id] !== undefined) nextQuestion();
                } else if (e.key === 'ArrowLeft') {
                    prevQuestion();
                } else if (e.key >= '1' && e.key <= '5') {
                    const q = questions[state.currentIndex];
                    state.answers[q.id] = parseInt(e.key);
                    renderQuestion();
                    updateNavButtons();
                }
            });

            // 初始化
            showPage('intro');
            updateProgress();
            updateNavButtons();
        })();
    </script>
</body>
</html>
