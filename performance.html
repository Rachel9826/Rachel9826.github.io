<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GPU/CPU 极限性能测试</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #d4d4d4;
            --text-bright: #f0f0f0;
            --text-dim: #7a7a7a;
            --accent: #5b9bd5;
            --success: #4caf50;
            --danger: #e74c3c;
            --warning: #f39c12;
            --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
            --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            --radius: 3px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--sans);
            color: var(--text);
            font-size: 14px;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 3D画布 */
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 顶部信息栏 */
        .stats-panel {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 10;
            font-family: var(--mono);
            font-size: 12px;
            color: #fff;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 14px;
            border-radius: var(--radius);
            letter-spacing: 0.3px;
            line-height: 1.8;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.7);
        }
        .stats-panel .label {
            color: var(--text-dim);
            margin-right: 6px;
        }
        .stats-panel .value {
            color: #fff;
            font-weight: 600;
            display: inline-block;
            min-width: 45px;
            text-align: right;
        }
        .stats-panel .value.fps-current {
            color: #4caf50;
            font-size: 16px;
        }
        .stats-panel .value.fps-avg {
            color: #ffd54f;
        }
        .stats-panel .value.fps-max {
            color: #5b9bd5;
        }
        .stats-panel .value.particle-count {
            color: #ff9f43;
        }

        /* 帧率曲线容器 */
        .chart-container {
            position: absolute;
            bottom: 70px;
            left: 10px;
            right: 10px;
            height: 120px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            overflow: hidden;
        }
        #fps-chart {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 底部控制栏 */
        .controls {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 14px;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: auto;
        }
        .controls button {
            width: 44px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            font-family: var(--mono);
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .controls button:active {
            background: rgba(255, 255, 255, 0.3);
        }
        .controls .count-display {
            font-family: var(--mono);
            font-size: 14px;
            color: #fff;
            min-width: 70px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .controls .reset-btn {
            width: auto;
            padding: 0 12px;
            font-size: 12px;
        }

        /* 返回按钮 */
        .back-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            color: #fff;
            font-size: 12px;
            padding: 8px 12px;
            cursor: pointer;
            font-family: var(--mono);
            letter-spacing: 0.5px;
            transition: background 0.15s;
            pointer-events: auto;
        }
        .back-btn:active {
            background: rgba(255, 255, 255, 0.25);
        }

        /* 版权 */
        .copyright {
            position: absolute;
            bottom: 70px;
            right: 14px;
            z-index: 10;
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            letter-spacing: 0.3px;
        }

        @media (max-width: 480px) {
            .stats-panel {
                font-size: 10px;
                padding: 6px 10px;
                top: 10px;
                left: 10px;
            }
            .controls button {
                width: 36px;
                height: 34px;
                font-size: 16px;
            }
            .controls .count-display {
                font-size: 12px;
                min-width: 50px;
            }
            .chart-container {
                bottom: 60px;
                height: 90px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Three.js 画布 -->
        <canvas id="webgl-canvas"></canvas>

        <!-- 统计面板 -->
        <div class="stats-panel">
            <div><span class="label">实时帧率</span> <span class="value fps-current" id="fps-current">--</span> Hz</div>
            <div><span class="label">平均帧率</span> <span class="value fps-avg" id="fps-avg">--</span> Hz</div>
            <div><span class="label">最大帧率</span> <span class="value fps-max" id="fps-max">--</span> Hz</div>
            <div><span class="label">粒子数量</span> <span class="value particle-count" id="particle-count">--</span></div>
        </div>

        <!-- 帧率曲线 -->
        <div class="chart-container">
            <canvas id="fps-chart"></canvas>
        </div>

        <!-- 底部控制 -->
        <div class="controls">
            <button id="btn-decrease" title="减少粒子">−</button>
            <span class="count-display" id="count-display">100000</span>
            <button id="btn-increase" title="增加粒子">+</button>
            <button class="reset-btn" id="btn-reset">重置</button>
        </div>

        <!-- 返回按钮 -->
        <button class="back-btn" id="back-btn">← 返回</button>

        <!-- 版权 -->
        <div class="copyright">&copy; Brian</div>
    </div>

    <!-- 引入 Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== DOM 元素 ====================
        const canvas = document.getElementById('webgl-canvas');
        const fpsCurrentEl = document.getElementById('fps-current');
        const fpsAvgEl = document.getElementById('fps-avg');
        const fpsMaxEl = document.getElementById('fps-max');
        const particleCountEl = document.getElementById('particle-count');
        const countDisplayEl = document.getElementById('count-display');
        const btnDecrease = document.getElementById('btn-decrease');
        const btnIncrease = document.getElementById('btn-increase');
        const btnReset = document.getElementById('btn-reset');
        const backBtn = document.getElementById('back-btn');
        const chartCanvas = document.getElementById('fps-chart');
        const chartCtx = chartCanvas.getContext('2d');

        // ==================== 场景初始化 ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        // 使用透视相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制像素比以避免过度绘制

        // 粒子系统
        let particleSystem = null;
        const MAX_PARTICLES = 300000; // 最大粒子数量，避免完全卡死
        const MIN_PARTICLES = 10000;
        const DEFAULT_PARTICLES = 100000;
        let particleCount = DEFAULT_PARTICLES;
        let positions, colors, velocities, initialPositions;

        // 创建粒子几何体
        function createParticleSystem(count) {
            if (particleSystem) {
                scene.remove(particleSystem);
                particleSystem.geometry.dispose();
                particleSystem.material.dispose();
            }

            const geometry = new THREE.BufferGeometry();
            positions = new Float32Array(count * 3);
            colors = new Float32Array(count * 3);
            velocities = new Float32Array(count * 3);
            initialPositions = new Float32Array(count * 3);

            // 初始化粒子数据
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                // 球体内部分布，更集中
                const radius = 15 + Math.random() * 5;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                
                positions[i3] = x;
                positions[i3 + 1] = y;
                positions[i3 + 2] = z;
                initialPositions[i3] = x;
                initialPositions[i3 + 1] = y;
                initialPositions[i3 + 2] = z;

                // 颜色：基于位置和随机，鲜艳色彩
                colors[i3] = 0.5 + 0.5 * Math.sin(x * 0.5);
                colors[i3 + 1] = 0.5 + 0.5 * Math.cos(y * 0.5);
                colors[i3 + 2] = 0.5 + 0.5 * Math.sin(z * 0.5);

                // 速度：小随机值，用于波动
                velocities[i3] = (Math.random() - 0.5) * 0.02;
                velocities[i3 + 1] = (Math.random() - 0.5) * 0.02;
                velocities[i3 + 2] = (Math.random() - 0.5) * 0.02;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.12,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.9,
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        // 更新粒子位置（模拟波动）
        function updateParticles(time) {
            if (!particleSystem) return;
            const count = particleCount;
            const posAttr = particleSystem.geometry.getAttribute('position');
            const posArray = posAttr.array;

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                // 使用正弦波产生流动效果
                const offsetX = Math.sin(time * 0.001 + i * 0.01) * 0.8;
                const offsetY = Math.cos(time * 0.0013 + i * 0.012) * 0.8;
                const offsetZ = Math.sin(time * 0.0011 + i * 0.009) * 0.8;
                
                posArray[i3] = initialPositions[i3] + offsetX;
                posArray[i3 + 1] = initialPositions[i3 + 1] + offsetY;
                posArray[i3 + 2] = initialPositions[i3 + 2] + offsetZ;
            }
            posAttr.needsUpdate = true;
        }

        // ==================== 帧率统计 ====================
        let fpsHistory = []; // 存储最近N帧的fps
        const MAX_HISTORY = 180; // 记录3秒左右（60fps）
        let fpsMax = 0;
        let fpsSum = 0;
        let fpsCount = 0;
        let fpsAvg = 0;
        let lastFrameTime = performance.now();
        let frameCount = 0;

        function calculateFPS(now) {
            const delta = now - lastFrameTime;
            lastFrameTime = now;
            if (delta <= 0) return;
            const fps = 1000 / delta;
            
            // 更新最大
            if (fps > fpsMax) fpsMax = fps;
            
            // 更新平均值
            fpsSum += fps;
            fpsCount++;
            fpsAvg = fpsSum / fpsCount;
            
            // 存储历史
            fpsHistory.push(fps);
            if (fpsHistory.length > MAX_HISTORY) {
                fpsHistory.shift();
            }
            
            // 更新DOM
            fpsCurrentEl.textContent = fps.toFixed(1);
            fpsAvgEl.textContent = fpsAvg.toFixed(1);
            fpsMaxEl.textContent = fpsMax.toFixed(1);
            particleCountEl.textContent = particleCount;
            countDisplayEl.textContent = particleCount;
        }

        // ==================== 帧率曲线绘制 ====================
        function drawChart() {
            const width = chartCanvas.width;
            const height = chartCanvas.height;
            chartCtx.clearRect(0, 0, width, height);
            
            // 背景
            chartCtx.fillStyle = 'rgba(0,0,0,0.3)';
            chartCtx.fillRect(0, 0, width, height);
            
            // 网格线
            chartCtx.strokeStyle = 'rgba(255,255,255,0.1)';
            chartCtx.lineWidth = 1;
            for (let i = 1; i < 4; i++) {
                const y = height * i / 4;
                chartCtx.beginPath();
                chartCtx.moveTo(0, y);
                chartCtx.lineTo(width, y);
                chartCtx.stroke();
            }
            
            if (fpsHistory.length < 2) return;
            
            // 绘制曲线
            const maxFPS = Math.max(60, Math.ceil(Math.max(...fpsHistory) / 10) * 10); // 至少60
            chartCtx.beginPath();
            chartCtx.strokeStyle = '#4caf50';
            chartCtx.lineWidth = 2;
            chartCtx.lineJoin = 'round';
            
            const stepX = width / (MAX_HISTORY - 1);
            const startX = width - (fpsHistory.length - 1) * stepX;
            
            for (let i = 0; i < fpsHistory.length; i++) {
                const x = startX + i * stepX;
                const y = height - (fpsHistory[i] / maxFPS) * (height - 10) - 5;
                if (i === 0) {
                    chartCtx.moveTo(x, y);
                } else {
                    chartCtx.lineTo(x, y);
                }
            }
            chartCtx.stroke();
            
            // 绘制当前值点
            if (fpsHistory.length > 0) {
                const lastX = startX + (fpsHistory.length - 1) * stepX;
                const lastY = height - (fpsHistory[fpsHistory.length - 1] / maxFPS) * (height - 10) - 5;
                chartCtx.fillStyle = '#fff';
                chartCtx.beginPath();
                chartCtx.arc(lastX, lastY, 3, 0, Math.PI * 2);
                chartCtx.fill();
            }
            
            // 显示最大fps参考线
            chartCtx.fillStyle = 'rgba(255,255,255,0.5)';
            chartCtx.font = '9px monospace';
            chartCtx.fillText(`${maxFPS} fps`, width - 40, 12);
        }

        // ==================== 调整粒子数量 ====================
        function setParticleCount(newCount) {
            newCount = Math.max(MIN_PARTICLES, Math.min(MAX_PARTICLES, newCount));
            if (newCount === particleCount) return;
            particleCount = newCount;
            createParticleSystem(particleCount);
            // 重置统计，避免旧数据干扰
            fpsMax = 0;
            fpsSum = 0;
            fpsCount = 0;
            fpsAvg = 0;
            fpsHistory = [];
            updateParticleCountDisplay();
        }

        function updateParticleCountDisplay() {
            particleCountEl.textContent = particleCount;
            countDisplayEl.textContent = particleCount;
        }

        // ==================== 动画循环 ====================
        function animate() {
            requestAnimationFrame(animate);
            
            const now = performance.now();
            // 帧率统计
            calculateFPS(now);
            
            // 更新粒子
            updateParticles(now);
            
            // 旋转场景
            scene.rotation.y += 0.0005;
            scene.rotation.x += 0.0002;
            
            // 渲染
            renderer.render(scene, camera);
            
            // 绘制帧率曲线
            drawChart();
        }

        // ==================== 窗口大小调整 ====================
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // 调整图表画布大小
            const chartContainer = chartCanvas.parentElement;
            chartCanvas.width = chartContainer.clientWidth;
            chartCanvas.height = chartContainer.clientHeight;
        }

        window.addEventListener('resize', onResize);

        // ==================== 事件绑定 ====================
        btnIncrease.addEventListener('click', () => {
            setParticleCount(particleCount + 20000);
        });
        btnDecrease.addEventListener('click', () => {
            setParticleCount(particleCount - 20000);
        });
        btnReset.addEventListener('click', () => {
            setParticleCount(DEFAULT_PARTICLES);
            fpsMax = 0;
            fpsSum = 0;
            fpsCount = 0;
            fpsAvg = 0;
            fpsHistory = [];
        });

        // 双指触摸调整（移动端）
        let lastTouchY = null;
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const y = e.touches[0].clientY;
                if (lastTouchY !== null) {
                    const diff = lastTouchY - y;
                    if (Math.abs(diff) > 20) {
                        if (diff > 0) {
                            setParticleCount(particleCount + 30000);
                        } else {
                            setParticleCount(particleCount - 30000);
                        }
                        lastTouchY = y;
                    }
                } else {
                    lastTouchY = y;
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            lastTouchY = null;
        });

        // 返回按钮
        backBtn.addEventListener('click', () => {
            window.history.back();
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === '+' || e.key === '=') {
                setParticleCount(particleCount + 20000);
            } else if (e.key === '-') {
                setParticleCount(particleCount - 20000);
            } else if (e.key === 'r' || e.key === 'R') {
                setParticleCount(DEFAULT_PARTICLES);
                fpsMax = 0;
                fpsSum = 0;
                fpsCount = 0;
                fpsAvg = 0;
                fpsHistory = [];
            }
        });

        // ==================== 初始化 ====================
        function init() {
            // 设置图表尺寸
            const chartContainer = chartCanvas.parentElement;
            chartCanvas.width = chartContainer.clientWidth;
            chartCanvas.height = chartContainer.clientHeight;
            
            // 创建初始粒子系统
            createParticleSystem(DEFAULT_PARTICLES);
            particleCount = DEFAULT_PARTICLES;
            updateParticleCountDisplay();
            
            // 启动动画
            animate();
        }

        init();
    </script>
</body>
</html>
