<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维码生成工具</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f5f7fa;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* 主卡片 */
.container {
  background: #fff;
  border-radius: 16px;
  padding: 32px 24px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  border: 2px dashed #3498db;
  text-align: center;
}

.header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
}

.header .icon {
  font-size: 28px;
}

.header h1 {
  font-size: 24px;
  color: #2c3e50;
  font-weight: 600;
}

.input-group {
  margin-bottom: 20px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s;
}

.input-group input:focus {
  border-color: #3498db;
}

.btn {
  width: 100%;
  padding: 14px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}

.btn:hover {
  background: #2980b9;
}

.tip {
  margin-top: 20px;
  font-size: 14px;
  color: #7f8c8d;
}

/* 二维码展示区 */
#qrcode {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 200px;
}

#qrcode canvas,
#qrcode img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
}

/* ✅ 版权：独立在最外层底部 */
.footer {
  margin-top: 30px;
  font-size: 13px;
  color: #95a5a6;
  text-align: center;
}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <span class="icon">📱</span>
    <h1>二维码生成工具</h1>
  </div>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="请输入网址，如 https://www.baidu.com">
  </div>

  <button class="btn" onclick="generateQR()">生成二维码</button>

  <div class="tip">
    输入完整网址（需包含 http:// 或 https://）
  </div>

  <div id="qrcode"></div>
</div>

<!-- ✅ 版权放在最下面 -->
<div class="footer">
  本网站版权归 ©️DRQ 所有
</div>

<script>
function generateQR() {
  const url = document.getElementById('urlInput').value.trim();
  const qrBox = document.getElementById('qrcode');
  
  // 清空旧的二维码
  qrBox.innerHTML = '';

  if (!url) {
    alert('请输入网址');
    return;
  }

  if (!/^https?:\/\/.+/.test(url)) {
    alert('网址需以 http:// 或 https:// 开头');
    return;
  }

  // 生成新的二维码
  new QRCode(qrBox, {
    text: url,
    width: 200,
    height: 200,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
}
</script>
</body>
</html>
