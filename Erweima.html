<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字生成二维码</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F5F0EB;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
            color: #3D352E;
            line-height: 1.6;
        }

        .card {
            max-width: 520px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 28px;
            padding: 44px 40px 36px;
            box-shadow: 0 12px 48px rgba(60, 50, 40, 0.08), 0 4px 16px rgba(60, 50, 40, 0.04);
            transition: box-shadow 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: #F0EAE4;
            border-radius: 16px;
            margin-bottom: 14px;
            color: #7A6B5D;
            font-size: 26px;
            transition: background 0.25s ease;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #3D352E;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 15px;
            color: #9A8B7D;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            align-items: stretch;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #E5DDD5;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 400;
            color: #3D352E;
            background: #FCFAF8;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            height: 100%;
            min-height: 54px;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: #B8A99C;
            font-weight: 300;
            letter-spacing: 0.2px;
        }

        .input-wrapper input:focus {
            border-color: #B8A08E;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(184, 160, 142, 0.15);
        }

        .input-wrapper input:hover {
            border-color: #CABFB3;
        }

        .btn-generate {
            flex-shrink: 0;
            padding: 0 28px;
            background: #8B7D6B;
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
            height: 54px;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn-generate:hover {
            background: #6D5F4F;
            box-shadow: 0 4px 16px rgba(109, 95, 79, 0.25);
        }

        .btn-generate:active {
            transform: scale(0.97);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .url-hint {
            font-size: 13px;
            color: #B8A08E;
            margin-top: -16px;
            margin-bottom: 20px;
            padding-left: 4px;
            min-height: 22px;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .url-hint.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .url-hint span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .result-section {
            display: none;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.45s ease, transform 0.45s ease;
            flex-direction: column;
            align-items: center;
            padding-top: 8px;
        }

        .result-section.visible {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .qr-container {
            background: #FFFFFF;
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(60, 50, 40, 0.06);
            border: 1px solid #F0EAE4;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .qr-container #qrcode {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 220px;
            height: 220px;
        }

        .qr-container #qrcode canvas,
        .qr-container #qrcode img {
            max-width: 100%;
            max-height: 100%;
            display: block;
            border-radius: 4px;
        }

        .content-display {
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
        }

        .content-label {
            font-size: 13px;
            color: #B8A99C;
            letter-spacing: 0.5px;
            font-weight: 400;
            display: block;
            margin-bottom: 4px;
        }

        .content-text {
            font-size: 16px;
            font-weight: 450;
            color: #3D352E;
            word-break: break-all;
            padding: 0 4px;
        }

        .content-text.url {
            color: #8B7D6B;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1.5px;
            text-decoration-color: #D5CBC1;
            cursor: pointer;
            transition: color 0.2s ease, text-decoration-color 0.2s ease;
        }

        .content-text.url:hover {
            color: #6D5F4F;
            text-decoration-color: #B8A08E;
        }

        /* ===== 扫码提示 ===== */
        .scan-tip {
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: #B8A08E;
            padding: 6px 0 10px 0;
            min-height: 30px;
            transition: opacity 0.3s ease;
        }

        .scan-tip .tip-icon {
            margin-right: 6px;
        }

        .actions {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn-secondary {
            padding: 10px 24px;
            background: transparent;
            color: #7A6B5D;
            border: 1.5px solid #E5DDD5;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 450;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            min-width: 120px;
        }

        .btn-secondary:hover {
            background: #F5F0EB;
            border-color: #CABFB3;
            color: #3D352E;
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        .btn-secondary .icon {
            font-size: 16px;
            line-height: 1;
        }

        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #EFE9E2;
            text-align: center;
            font-size: 14px;
            color: #B8A99C;
            letter-spacing: 0.5px;
            font-weight: 350;
        }

        .footer a {
            color: #B8A99C;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: #7A6B5D;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #3D352E;
            color: #F5F0EB;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 400;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(60, 50, 40, 0.2);
            z-index: 999;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 520px) {
            .card {
                padding: 28px 20px 24px;
                border-radius: 20px;
            }
            .header h1 {
                font-size: 21px;
            }
            .header p {
                font-size: 14px;
            }
            .input-section {
                flex-direction: column;
                gap: 10px;
            }
            .input-wrapper input {
                min-height: 48px;
                font-size: 14px;
                padding: 12px 16px;
            }
            .btn-generate {
                height: 48px;
                padding: 0 20px;
                font-size: 14px;
                width: 100%;
            }
            .qr-container #qrcode {
                width: 180px;
                height: 180px;
            }
            .qr-container {
                padding: 12px;
            }
            .content-text {
                font-size: 15px;
            }
            .btn-secondary {
                padding: 8px 18px;
                font-size: 13px;
                min-width: 100px;
            }
            .footer {
                font-size: 13px;
            }
            .toast {
                font-size: 13px;
                padding: 10px 20px;
                bottom: 20px;
                max-width: 90%;
            }
            .scan-tip {
                font-size: 12px;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 20px 14px 18px;
            }
            .qr-container #qrcode {
                width: 150px;
                height: 150px;
            }
            .header-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
            .actions {
                flex-direction: column;
                align-items: center;
            }
            .btn-secondary {
                width: 100%;
                max-width: 200px;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #2C2824;
            }
            .card {
                background: #3A3530;
                box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3);
            }
            .header h1 {
                color: #E8E0D8;
            }
            .header p {
                color: #B8A99C;
            }
            .header-icon {
                background: #4A443E;
                color: #CABFB3;
            }
            .input-wrapper input {
                background: #2C2824;
                border-color: #5A5048;
                color: #E8E0D8;
            }
            .input-wrapper input::placeholder {
                color: #8B7D6D;
            }
            .input-wrapper input:focus {
                border-color: #B8A08E;
                background: #3A3530;
                box-shadow: 0 0 0 4px rgba(184, 160, 142, 0.12);
            }
            .input-wrapper input:hover {
                border-color: #7A6B5D;
            }
            .btn-generate {
                background: #A09080;
            }
            .btn-generate:hover {
                background: #B8A99C;
                box-shadow: 0 4px 16px rgba(184, 169, 156, 0.2);
            }
            .qr-container {
                background: #2C2824;
                border-color: #4A443E;
            }
            .content-text {
                color: #E8E0D8;
            }
            .content-text.url {
                color: #CABFB3;
                text-decoration-color: #6D5F4F;
            }
            .content-text.url:hover {
                color: #E8E0D8;
                text-decoration-color: #B8A08E;
            }
            .content-label {
                color: #8B7D6D;
            }
            .btn-secondary {
                color: #CABFB3;
                border-color: #5A5048;
            }
            .btn-secondary:hover {
                background: #4A443E;
                border-color: #7A6B5D;
                color: #E8E0D8;
            }
            .footer {
                border-top-color: #4A443E;
                color: #8B7D6D;
            }
            .footer a {
                color: #8B7D6D;
            }
            .footer a:hover {
                color: #CABFB3;
            }
            .toast {
                background: #E8E0D8;
                color: #2C2824;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            }
            .url-hint {
                color: #CABFB3;
            }
            .qr-container #qrcode canvas {
                filter: invert(0.92) hue-rotate(180deg);
            }
            .scan-tip {
                color: #B8A08E;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #D5CBC1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #B8A99C;
        }
        ::selection {
            background: #D5CBC1;
            color: #3D352E;
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-label="文字生成二维码工具">

        <header class="header">
            <div class="header-icon" aria-hidden="true">✦</div>
            <h1>文字生成二维码</h1>
            <p>输入文字或网址，即刻生成可扫描的二维码</p>
        </header>

        <div class="input-section">
            <div class="input-wrapper">
                <input
                type="text"
                id="textInput"
                placeholder="请输入文字或网址…"
                autofocus
                aria-label="输入要生成二维码的文字或网址"
                >
            </div>
            <button class="btn-generate" id="generateBtn">生成</button>
        </div>

        <div class="url-hint" id="urlHint">
            <span>🔗 检测到网址，扫码后可直接打开</span>
        </div>

        <div class="result-section" id="resultSection">
            <div class="qr-container">
                <div id="qrcode"></div>
            </div>

            <div class="content-display">
                <span class="content-label">扫码结果</span>
                <span class="content-text" id="resultText"></span>
            </div>

            <!-- 扫码提示 -->
            <div class="scan-tip" id="scanTip"></div>

            <div class="actions">
                <button class="btn-secondary" id="copyBtn">
                    <span class="icon">📋</span> 复制文本
                </button>
                <button class="btn-secondary" id="downloadBtn">
                    <span class="icon">⬇</span> 下载二维码
                </button>
                <button class="btn-secondary" id="resetBtn">
                    <span class="icon">↻</span> 重新生成
                </button>
            </div>
        </div>

        <footer class="footer">
            ©️Brian
        </footer>
    </div>

    <div class="toast" id="toast" role="alert"></div>

    <script>
        (function() {
            'use strict';

            const input = document.getElementById('textInput');
            const generateBtn = document.getElementById('generateBtn');
            const resultSection = document.getElementById('resultSection');
            const qrContainer = document.getElementById('qrcode');
            const resultText = document.getElementById('resultText');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');
            const copyBtn = document.getElementById('copyBtn');
            const urlHint = document.getElementById('urlHint');
            const scanTip = document.getElementById('scanTip');
            const toast = document.getElementById('toast');

            let qrCodeInstance = null;
            let currentText = '';
            let isUrl = false;
            let toastTimer = null;

            function isURL(str) {
                if (!str || typeof str !== 'string') return false;
                const trimmed = str.trim();
                return /^(https?:\/\/)/i.test(trimmed);
            }

            function showToast(message, duration) {
                duration = duration || 2200;
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toast.classList.remove('show');
                }
                void toast.offsetWidth;
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, duration);
            }

            function generateQR(text) {
                if (!text || text.trim() === '') {
                    resultSection.classList.remove('visible');
                    urlHint.classList.remove('visible');
                    scanTip.textContent = '';
                    if (qrCodeInstance) {
                        qrCodeInstance.clear();
                        qrCodeInstance = null;
                    }
                    return;
                }

                const trimmed = text.trim();
                currentText = trimmed;
                isUrl = isURL(trimmed);

                if (isUrl) {
                    urlHint.classList.add('visible');
                    scanTip.textContent = '✅ 扫码后可直接打开网址';
                    scanTip.style.color = '#8B7D6B';
                } else {
                    urlHint.classList.remove('visible');
                    scanTip.textContent = '📱 微信扫码可能无法直接显示文本，建议使用系统相机或第三方扫码应用';
                    scanTip.style.color = '#B8A08E';
                }

                if (qrCodeInstance) {
                    qrCodeInstance.clear();
                    qrCodeInstance = null;
                }
                qrContainer.innerHTML = '';

                try {
                    qrCodeInstance = new QRCode(qrContainer, {
                        text: trimmed,
                        width: 220,
                        height: 220,
                        colorDark: '#3D352E',
                        colorLight: '#FFFFFF',
                        correctLevel: QRCode.CorrectLevel.H,
                    });

                    resultSection.classList.add('visible');

                    resultText.textContent = trimmed;
                    if (isUrl) {
                        resultText.className = 'content-text url';
                        resultText.style.cursor = 'pointer';
                        resultText.onclick = function() {
                            window.open(trimmed, '_blank');
                        };
                        resultText.title = '点击打开链接';
                    } else {
                        resultText.className = 'content-text';
                        resultText.style.cursor = 'default';
                        resultText.onclick = null;
                        resultText.title = '';
                    }
                } catch (error) {
                    console.error('二维码生成失败:', error);
                    showToast('生成失败，请检查输入内容');
                    resultSection.classList.remove('visible');
                    urlHint.classList.remove('visible');
                    scanTip.textContent = '';
                }
            }

            function downloadQR() {
                if (!qrCodeInstance) {
                    showToast('请先生成二维码');
                    return;
                }
                const canvas = qrContainer.querySelector('canvas');
                if (!canvas) {
                    showToast('二维码尚未渲染完成');
                    return;
                }
                try {
                    const dataUrl = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = 'qrcode.png';
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast('✅ 二维码已下载');
                } catch (error) {
                    console.error('下载失败:', error);
                    showToast('下载失败，请重试');
                }
            }

            function copyText() {
                if (!currentText) {
                    showToast('没有可复制的内容');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(currentText).then(() => {
                        showToast('✅ 已复制到剪贴板');
                    }).catch(() => {
                        fallbackCopy(currentText);
                    });
                } else {
                    fallbackCopy(currentText);
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    const success = document.execCommand('copy');
                    if (success) {
                        showToast('✅ 已复制到剪贴板');
                    } else {
                        showToast('复制失败，请手动复制');
                    }
                } catch (e) {
                    showToast('复制失败，请手动复制');
                }
                document.body.removeChild(textarea);
            }

            function resetAndGenerate() {
                if (!input.value.trim()) {
                    input.focus();
                    return;
                }
                generateQR(input.value);
                input.focus();
            }

            function handleGenerate() {
                const text = input.value;
                if (!text || text.trim() === '') {
                    showToast('请输入文字或网址');
                    input.focus();
                    return;
                }
                generateQR(text);
            }

            generateBtn.addEventListener('click', handleGenerate);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleGenerate();
                }
            });
            downloadBtn.addEventListener('click', downloadQR);
            resetBtn.addEventListener('click', resetAndGenerate);
            copyBtn.addEventListener('click', copyText);

            input.addEventListener('input', function() {
                if (!this.value.trim()) {
                    resultSection.classList.remove('visible');
                    urlHint.classList.remove('visible');
                    scanTip.textContent = '';
                    if (qrCodeInstance) {
                        qrCodeInstance.clear();
                        qrCodeInstance = null;
                    }
                    qrContainer.innerHTML = '';
                }
            });

            input.focus();

            (function initFromURL() {
                try {
                    const params = new URLSearchParams(window.location.search);
                    const textParam = params.get('text');
                    if (textParam) {
                        const decoded = decodeURIComponent(textParam);
                        if (decoded.trim()) {
                            input.value = decoded;
                            setTimeout(function() {
                                handleGenerate();
                            }, 300);
                        }
                    }
                } catch (_) { /* ignore */ }
            })();

            input.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    handleGenerate();
                }
            });

            const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
            darkModeMedia.addEventListener('change', function() {
                if (currentText && qrCodeInstance) {
                    generateQR(currentText);
                }
            });

            window.__qrTool = {
                generate: generateQR,
                download: downloadQR,
                copy: copyText,
                reset: resetAndGenerate,
            };

            console.log('✦ 文字生成二维码工具已加载');
            console.log('  输入文字后点击 "生成" 或按回车键');
            console.log('  支持 URL 自动识别，扫码后可直接打开');
            console.log('  对于纯文本，微信扫码可能无法直接显示，可使用复制功能');
        })();
    </script>

</body>
</html>
