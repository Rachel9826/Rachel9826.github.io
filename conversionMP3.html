<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Conversion - 音频转换器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
    <style>
        :root {
            --primary: #4b6cb7;
            --secondary: #182848;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --bg-card-hover: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border: #333333;
            --success: #10b981;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .logo {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--bg-card-hover);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .upload-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-desc {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 80%;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: var(--primary);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            transition: background 0.3s;
            border: none;
            outline: none;
        }

        .btn:hover {
            background: #5a67d8;
        }

        .file-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card-hover);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .file-icon {
            color: var(--info);
            font-size: 1.5rem;
            min-width: 30px;
        }

        .file-name {
            font-weight: 500;
            word-break: break-all;
            flex: 1;
        }

        .file-size {
            color: var(--text-secondary);
            font-size: 0.85rem;
            min-width: 60px;
            text-align: right;
        }

        .file-status {
            color: var(--success);
            font-size: 0.85rem;
            min-width: 60px;
        }

        .remove-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            margin-left: 10px;
        }

        .remove-btn:hover {
            color: #ef4444;
            border-color: #ef4444;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.2s ease;
        }

        .status-text {
            text-align: center;
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .download-btn {
            display: none;
            background: var(--success);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            border: none;
            outline: none;
            transition: background 0.3s;
            align-items: center;
            gap: 10px;
        }

        .download-btn:hover {
            background: #059669;
        }

        .quality-settings {
            margin-top: 20px;
            padding: 15px;
            background: var(--bg-card-hover);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .quality-option {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .quality-option:last-child {
            margin-bottom: 0;
        }

        .quality-option input {
            margin-right: 10px;
        }

        .quality-option label {
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .quality-name {
            font-weight: 500;
        }

        .quality-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .convert-btn {
            display: none;
            background: var(--primary);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            border: none;
            outline: none;
            transition: background 0.3s;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin: 20px auto 0;
        }

        .convert-btn:hover {
            background: #5a67d8;
        }

        .download-list {
            margin-top: 20px;
            display: none;
        }

        .download-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card-hover);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .download-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .download-icon {
            color: var(--success);
            font-size: 1.5rem;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            width: 100%;
        }

        .free-notice {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success);
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
            color: var(--text-secondary);
        }

        .free-notice a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .free-notice a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo"><i class="fas fa-music"></i></div>
        <h1>Audio Conversion</h1>
        <p class="subtitle">支持多文件批量转换</p>
    </header>

    <main>
        <!-- 转换器主界面 -->
        <div class="card">
            <div class="upload-area" id="dropZone">
                <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                <div class="upload-title">拖放音频文件到这里</div>
                <div class="upload-desc">支持多文件选择，可同时转换多个音频文件</div>
                <button class="btn" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-folder-open"></i> 选择多个音频文件
                </button>
                <input type="file" id="fileInput" class="file-input" accept="audio/*" multiple>
            </div>

            <div class="file-list" id="fileList"></div>

            <div class="quality-settings" id="qualitySettings" style="display:none;">
                <h3 style="margin-bottom:15px;">转换质量设置</h3>
                <div class="quality-option">
                    <input type="radio" id="fast" name="quality" value="fast" checked>
                    <label for="fast">
                        <span class="quality-name">快速转换 (推荐)</span>
                        <span class="quality-desc">3-5秒完成转换，保持良好音质</span>
                    </label>
                </div>
                <div class="quality-option">
                    <input type="radio" id="standard" name="quality" value="standard">
                    <label for="standard">
                        <span class="quality-name">标准质量</span>
                        <span class="quality-desc">6-10秒完成，更佳音质</span>
                    </label>
                </div>
                <div class="quality-option">
                    <input type="radio" id="high" name="quality" value="high">
                    <label for="high">
                        <span class="quality-name">高质量</span>
                        <span class="quality-desc">10-20秒完成，最佳音质体验</span>
                    </label>
                </div>
            </div>

            <button class="convert-btn" id="convertBtn" onclick="startConversion()">
                <i class="fas fa-sync-alt"></i> 开始批量转换
            </button>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="status-text" id="statusText">正在处理中，请稍候...</div>
            </div>

            <div class="download-list" id="downloadList"></div>

            <div class="action-buttons">
                <button id="downloadBtn" class="download-btn" onclick="triggerBatchDownload()">
                    <i class="fas fa-download"></i> 批量下载全部
                </button>
            </div>
        </div>

        <!-- 免费使用说明（保留） -->
        <div class="free-notice">
            <p><strong>为了帮助更多需要的人，本网站全部免费！</strong></p>
            <p>如果您需要更多资源或工具，可以访问
               <a href="https://rachel9826.github.io/websitecollection.html" target="_blank">
                   https://rachel9826.github.io/websitecollection.html
               </a>，我们将实时更新更多实用工具。
            </p>
        </div>
    </main>

    <footer>
        &copy; 2026 Audio Conversion - 版权归 deng-r-qi 所有
    </footer>
</div>

<script>
let files = [];
let mp3Blobs = [];
let isConverting = false;
let convertedCount = 0;
let totalFiles = 0;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const qualitySettings = document.getElementById('qualitySettings');
const convertBtn = document.getElementById('convertBtn');
const progressContainer = document.getElementById('progressContainer');
const progressFill = document.getElementById('progressFill');
const statusText = document.getElementById('statusText');
const downloadBtn = document.getElementById('downloadBtn');
const downloadList = document.getElementById('downloadList');

['dragenter','dragover','dragleave','drop'].forEach(e =>
    dropZone.addEventListener(e, e => e.preventDefault())
);

dropZone.addEventListener('drop', e => {
    handleFileSelect(Array.from(e.dataTransfer.files));
});

fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
        handleFileSelect(Array.from(fileInput.files));
    }
});

function handleFileSelect(selectedFiles) {
    const audioFiles = selectedFiles.filter(f => f.type.startsWith('audio/'));
    if (!audioFiles.length) return alert('请选择音频文件！');

    audioFiles.forEach(f => {
        if (!files.some(x => x.name === f.name && x.size === f.size)) {
            files.push(f);
        }
    });

    renderFiles();
    qualitySettings.style.display = 'block';
    convertBtn.style.display = 'flex';
}

function renderFiles() {
    fileList.innerHTML = '';
    files.forEach((f, i) => {
        const size = (f.size / 1024 / 1024).toFixed(2);
        fileList.innerHTML += `
        <div class="file-item">
            <div class="file-info">
                <i class="fas fa-file-audio file-icon"></i>
                <span class="file-name">${f.name}</span>
                <span class="file-size">${size} MB</span>
                <span class="file-status" id="file-status-${i}">等待</span>
            </div>
            <button class="remove-btn" onclick="removeFile(${i})"><i class="fas fa-times"></i></button>
        </div>`;
    });
}

function removeFile(i) {
    files.splice(i, 1);
    renderFiles();
    if (!files.length) {
        qualitySettings.style.display = 'none';
        convertBtn.style.display = 'none';
    }
}

async function startConversion() {
    if (!files.length || isConverting) return;
    isConverting = true;
    totalFiles = files.length;
    convertedCount = 0;
    mp3Blobs = [];

    convertBtn.disabled = true;
    progressContainer.style.display = 'block';

    const quality = document.querySelector('input[name="quality"]:checked').value;

    for (let i = 0; i < files.length; i++) {
        if (!isConverting) break;
        const status = document.getElementById(`file-status-${i}`);
        try {
            status.textContent = '转换中';
            const blob = await convertToMp3(files[i], quality);
            mp3Blobs.push({ blob, originalName: files[i].name });
            status.textContent = '完成';
            convertedCount++;
            progressFill.style.width = (convertedCount / totalFiles * 100) + '%';
        } catch {
            status.textContent = '失败';
        }
    }

    isConverting = false;
    convertBtn.disabled = false;
    downloadBtn.style.display = 'flex';
    showDownloadList();
}

function convertToMp3(file, quality) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async e => {
            try {
                const ctx = new AudioContext();
                const buffer = await ctx.decodeAudioData(e.target.result);
                const bitrate = quality === 'high' ? 320 : quality === 'standard' ? 192 : 128;
                const encoder = new lamejs.Mp3Encoder(buffer.numberOfChannels, buffer.sampleRate, bitrate);

                const left = buffer.getChannelData(0);
                const right = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : null;
                const data = [];

                for (let i = 0; i < left.length; i += 1152) {
                    const l = left.subarray(i, i + 1152);
                    const r = right ? right.subarray(i, i + 1152) : null;
                    const mp3 = encoder.encodeBuffer(l, r);
                    if (mp3.length) data.push(new Int8Array(mp3));
                }
                const end = encoder.flush();
                if (end.length) data.push(new Int8Array(end));
                resolve(new Blob(data, { type: 'audio/mp3' }));
            } catch (err) {
                reject(err);
            }
        };
        reader.readAsArrayBuffer(file);
    });
}

function showDownloadList() {
    downloadList.style.display = 'block';
    downloadList.innerHTML = '';
    mp3Blobs.forEach((item, i) => {
        const name = item.originalName.replace(/\.[^/.]+$/, "") + ".mp3";
        downloadList.innerHTML += `
        <div class="download-item">
            <div class="download-info">
                <i class="fas fa-download download-icon"></i>
                <span>${name}</span>
            </div>
            <button class="btn" onclick="downloadSingleFile(${i})">下载</button>
        </div>`;
    });
}

function downloadSingleFile(i) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(mp3Blobs[i].blob);
    a.download = mp3Blobs[i].originalName.replace(/\.[^/.]+$/, "") + ".mp3";
    a.click();
}

function triggerBatchDownload() {
    mp3Blobs.forEach((_, i) => setTimeout(() => downloadSingleFile(i), i * 300));
}
</script>
</body>
</html>
